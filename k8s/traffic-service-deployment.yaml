apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-deployment
  labels:
    app: traffic-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traffic-pods
  template:
    metadata:
      labels:
        app: traffic-pods
    spec:
      containers:
        - name: traffic-service
          image: ghcr.io/saumilshah-7/traffic-service:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 7777
          envFrom:
            - secretRef:
                name: traffic-service-secret
          env:
            - name: POSTGRESQL_URI
              value: postgresql://host.docker.internal:5432
            - name: PORT
              value: "7777"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: traffic-service
spec:
  type: LoadBalancer
  selector:
    app: traffic-pods
  ports:
    - name: http
      port: 7777
      targetPort: http
