apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-deployment
  labels:
    app: dashboard-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard-pods
  template:
    metadata:
      labels:
        app: dashboard-pods
    spec:
      containers:
        - name: dashboard-service
          image: ghcr.io/saumilshah-7/dashboard-service:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 9999
          env:
            - name: PORT
              value: "9999"
            - name: TRAFFIC_SERVICE_URL
              value: http://traffic-service:7777
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard-service
spec:
  type: LoadBalancer
  selector:
    app: dashboard-pods
  ports:
    - name: http
      port: 9999
      targetPort: http
