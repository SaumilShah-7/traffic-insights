name: Dashboard Service CI

on:
  push:
    branches: [main]
    paths:
      - "dashboard-service/**"
      - ".github/workflows/dashboard-service-ci.yaml"

  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: dashboard-service-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: dashboard-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup node
        uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: dashboard-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          # GHCR image names must be lowercase, but my github.repository_owner resolves to "SaumilShah-7"
          # Hence, hard coded in lower case
          docker build -t ghcr.io/saumilshah-7/dashboard-service:${{ github.sha }} -t ghcr.io/saumilshah-7/dashboard-service:latest .

      - name: Push image
        run: |
          docker push ghcr.io/saumilshah-7/dashboard-service:${{ github.sha }}
          docker push ghcr.io/saumilshah-7/dashboard-service:latest
