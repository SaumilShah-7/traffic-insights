name: Dashboard Service CI

on:
  push:
    branches: [main]
    paths:
      - "dashboard-service/**"
      - ".github/workflows/dashboard-service-ci.yaml"

  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  packages: write

concurrency:
  group: dashboard-service-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: dashboard-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup node
        uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: dashboard-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, push and get image digest
        id: image
        run: |
          IMAGE=ghcr.io/saumilshah-7/dashboard-service:${{ github.sha }}

          docker build -t "$IMAGE" .
          docker push "$IMAGE"

          DIGEST=$(docker image inspect \
            --format='{{index .RepoDigests 0}}' "$IMAGE" | sed 's|.*@||')

          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Update deployment digest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          sed -i -E "/name: ghcr.io\\/saumilshah-7\\/dashboard-service/{n;n;s|digest:.*|digest: ${IMAGE_DIGEST}|;}" \
            ../k8s/workloads/overlays/development/dashboard-service/kustomization.yaml

      - name: Open deployment pull request
        id: deployment_pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: deploy dashboard-service ${{ github.sha }}"
          title: "Deploy dashboard-service ${{ github.sha }}"
          body: "Updates the development deployment to the immutable image digest produced by CI."
          branch: automation/deploy-dashboard-service-${{ github.sha }}
          base: main
          delete-branch: true

      - name: Merge deployment PR
        if: steps.deployment_pr.outputs.pull-request-number
        run: gh pr merge --squash "${{ steps.deployment_pr.outputs.pull-request-number }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
